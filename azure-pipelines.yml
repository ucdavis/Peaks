# ASP.NET Core
# Build, test, and package the website and Windows WebJobs.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
  - master

name: 1.1.$(Date:yyMM).$(build.buildId)

pool:
  vmImage: "windows-latest"

variables:
  solution: "**/*.sln"
  buildPlatform: "Any CPU"
  buildConfiguration: "Release"

stages:
  - stage: Build
    jobs:
      - job:
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "22.x"
          - task: UseDotNet@2
            displayName: "Use .NET 10 SDK"
            inputs:
              packageType: sdk
              version: 10.0.402
              installationPath: $(Agent.ToolsDirectory)/dotnet

          - task: DotNetCoreCLI@2
            inputs:
              command: "restore"

          - task: DotNetCoreCLI@2
            displayName: "Build Keas.Mvc"
            inputs:
              command: "build"
              projects: "./Keas.Mvc/Keas.Mvc.csproj"
              arguments: "--configuration $(BuildConfiguration) /property:Version=$(build.buildNumber)"

          - task: Npm@1
            inputs:
              command: "ci"
              workingDir: "./Keas.Mvc/ClientApp"

          - script: npm run typecheck && npm run lint && npm run build && npm run test:launcher
            displayName: "Validate client tooling and development launcher"
            workingDirectory: "./Keas.Mvc/ClientApp"

          - task: DotNetCoreCLI@2
            displayName: "Run Server Tests"
            inputs:
              command: "test"

          - task: Npm@1
            displayName: "Run Client Tests"
            inputs:
              command: "custom"
              workingDir: "./Keas.Mvc/ClientApp"
              customCommand: "run citest"

          - task: PublishTestResults@2
            displayName: "Publish Client Tests"
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "**/ClientApp/test-results/junit.xml"
              failTaskOnFailedTests: true
              testRunTitle: "Client Tests"

          - task: PublishCodeCoverageResults@2
            displayName: "Publish Client Coverage"
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: "$(System.DefaultWorkingDirectory)/Keas.Mvc/ClientApp/coverage/cobertura-coverage.xml"

  - stage: Publish
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/master')
    jobs:
      - job:
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "22.x"
          - task: UseDotNet@2
            displayName: "Use .NET 10 SDK"
            inputs:
              packageType: sdk
              version: 10.0.402
              installationPath: $(Agent.ToolsDirectory)/dotnet
          - task: DotNetCoreCLI@2
            displayName: "Publish Keas.Mvc"
            inputs:
              command: "publish"
              publishWebProjects: true
              zipAfterPublish: false
              modifyOutputPath: false
              projects: "./Keas.Mvc/Keas.Mvc.csproj"
              arguments: "--configuration $(BuildConfiguration) --output $(build.artifactstagingdirectory)/"

          - task: DotNetCoreCLI@2
            displayName: "Publish Keas.Jobs.SendMail"
            inputs:
              command: "publish"
              publishWebProjects: false
              zipAfterPublish: false
              projects: "./Keas.Jobs.SendMail/Keas.Jobs.SendMail.csproj"
              arguments: "--configuration $(BuildConfiguration) --output $(build.artifactstagingdirectory)/app_data/jobs/triggered"

          - task: DotNetCoreCLI@2
            displayName: "Publish Keas.Jobs.LivedName"
            inputs:
              command: "publish"
              publishWebProjects: false
              zipAfterPublish: false
              projects: "./Keas.Jobs.LivedName/Keas.Jobs.LivedName.csproj"
              arguments: "--configuration $(BuildConfiguration) --output $(build.artifactstagingdirectory)/app_data/jobs/triggered"

          - task: PublishBuildArtifacts@1
            displayName: "Publish Artifact"
            inputs:
              PathtoPublish: "$(build.artifactstagingdirectory)"
