name: SQL migrations and sandbox
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SANDBOX_PROJECT: peaks-ci-${{ github.run_id }}-${{ github.run_attempt }}
      PEAKS_TEST_SQL: Server=127.0.0.1,14339;User ID=sa;Password=SandboxOnly123!;Encrypt=False;TrustServerCertificate=True;
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Start disposable SQL Server
        run: docker compose -f .devcontainer/docker-compose.sandbox.yml up -d --wait sql
      - name: Run SQL migration and legacy-behavior tests
        run: dotnet test Test -c Release --filter FullyQualifiedName~SqlServerMigrationTests
      - name: Rehearse future migration and rollback
        run: python3 dev/verify-migration-workflow.py
      - name: Build and start sandbox
        run: docker compose -f .devcontainer/docker-compose.sandbox.yml up --build -d --wait
      - name: Exercise real login and application routes
        run: python3 dev/smoke-sandbox.py
      - name: Show sandbox logs
        if: failure()
        run: docker compose -f .devcontainer/docker-compose.sandbox.yml logs --tail=100
      - name: Remove disposable resources
        if: always()
        run: docker compose -f .devcontainer/docker-compose.sandbox.yml down -v
